# E-HSFP Journal Experiment Registry
#
# Single source of truth for experiment identity, config, and status. This file is
# machine-readable and is summarized/linked from docs/JOURNAL_SIMULATION_RESULTS.md,
# which is the human-readable source of truth — keep both in sync.
#
# Schema per entry (all fields required; use null only where genuinely N/A):
#   experiment_id, result_group, dataset, task, method, variant, backbone, model_split,
#   num_clients, num_edges, participation_rate, num_rounds, local_epochs,
#   client_edge_interval, edge_cloud_interval, partition_type, dirichlet_alpha,
#   memory_size, memory_replay_ratio, dropout_rate, staleness, serverless_stress,
#   stress_parameters, aggregation_rule, synthesis_module, enabled_modules, seed_list,
#   required_metrics, output_directory, dependencies, protocol_hash, status, provenance,
#   failure_reason
#
# Status values: AUDIT_PENDING, IMPLEMENTATION_MISSING, READY, RUNNING, PARTIAL,
#   FAILED_RETRYABLE, FAILED_PERMANENT, COMPLETE_UNVALIDATED, VERIFIED_EXISTING,
#   VERIFIED_NEW, NOT_COMPARABLE, BLOCKED
#
# This file is populated incrementally as the campaign proceeds (Claude designs entries,
# Codex extends mechanically per docs/JOURNAL_SIMULATION_RESULTS.md Section 20's priority
# queue). It is NOT yet exhaustive — see docs/JOURNAL_SIMULATION_RESULTS.md Section 12/20.

