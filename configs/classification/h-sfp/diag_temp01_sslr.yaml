base: default.yaml

# Fast diagnostic: same CIFAR-100 / ResNet50 (Ic=5,Ie=10) as the smoke baseline
# (which ran with the OLD supcon_temperature=0.5), but short-horizon with frequent
# eval so we can compare the trajectory against that smoke run at matched epochs.
# Inherits supcon_temperature: 0.1 from default.yaml; adds ssl_lr for the SSL tiers.
strategy: "hier_fedavg"
dataset: "cifar100"
dataset_root: 'data/cifar/'
model: "resnet50"
num_classes: 100

# Short horizon + frequent aggregation/eval for a fast signal
epochs: 10
t1: 2
t2: 2

# Second lever under test: higher LR for the contrastive SSL tiers only
# (cloud classifier keeps `lr`, so it stays comparable to baselines).
ssl_lr: !!float 3e-4
