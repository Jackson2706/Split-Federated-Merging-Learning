is_gpu: true
gpu: 0
iid: true
num_users: 200
epochs: 200
frac: 0.1
local_bs: 16
optimizer: "adam"
lr: !!float 1e-4
momentum: 0.9
weight_decay: !!float 1e-4
verbose: false
print_every: 1

# --- Convergence: linear-warmup + cosine LR schedule ---------------------
# Peak LR is unchanged (= `lr`), so this stays FAIR vs the baselines; it just
# warms up then anneals, which converges in noticeably fewer epochs.
use_lr_schedule: true
warmup_epochs: 5
# Optional extra speed-up: a higher LR for the contrastive SSL tiers
# (client + edge). The supervised cloud classifier always keeps `lr`, so it
# stays directly comparable to the baselines. Defaults to `lr` (no change).
# NOTE: setting this introduces an SSL-phase LR asymmetry vs baselines —
# enable only if you accept that. Contrastive SSL typically wants a higher LR.
# ssl_lr: !!float 3e-4

input_size: 32
mid_server: [5]

ssl_epochs_client: 10
ssl_epochs_edge: 10
syn_epochs_cloud: 10
syn_samples_per_class: 50

# SupCon temperature for the client/edge contrastive tiers. Khosla et al. (2020)
# report the optimum near 0.1; lower temperature -> tighter, more separable
# class clusters -> cleaner per-class prototypes downstream. Applied identically
# to H-SFP and E-HSFP, so the comparison stays fair.
supcon_temperature: !!float 0.1

# --- E-HSFP extensions (all disabled by default = baseline H-SFP) ---
# Episodic Prototype Memory
use_episodic_memory: false
memory_size: 500
memory_replay_ratio: 0.3
memory_top_k: 5
max_prototype_age: 20

# Learnable Reliability-Aware Aggregation
aggregation_mode: "average"           # "average" | "learnable_reliability"
reliability_hidden_dim: 32
reliability_lr: !!float 1e-3
reliability_weight_decay: !!float 1e-4

# Prototype Replay Consistency Loss
use_prc_loss: false
lambda_prc: 0.1
prc_num_samples: 16

# Serverless Prototype Dropout
use_prototype_dropout: false
prototype_dropout_rate: 0.2
dropout_mode: "client_prototype"      # "client_prototype" | "edge_prototype" | "both"
use_dropout_consistency: false
lambda_dropout: 0.1

# Serverless Episode Simulator
use_serverless_simulation: false
cold_start_probability: 0.15
function_timeout_probability: 0.05
max_episode_duration: 30.0
latency_mean: 0.5
latency_std: 0.2

# Residual Prototype Generator
use_residual_generator: false
generator_hidden_dim: 64
generator_scale: 0.1

# Ablation mode (overrides individual flags when set)
# ablation_mode: null                 # baseline_hsfp | hsfp_memory | hsfp_memory_dropout | hsfp_memory_reliability | hsfp_memory_reliability_prc | full_e_hsfp
