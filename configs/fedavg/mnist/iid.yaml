experiment:
  baseline: "fedavg"
  dataset: "MNIST"              # MNIST | CIFAR10 | FashionMNIST
  model: "MLP"                  # MLP | CNN | ResNet
  rounds: 5
  clients: 10
  tiers: 3
  scenario: "iid"           # iid | non-iid
  # noniid_type: "dirichlet"      # dirichlet | label-split
  # alpha: 0.3
  # classes_per_client: 2

training:
  local_epochs: 1
  batch_size: 32
  lr: 0.01
  optimizer: "SGD"              # SGD | Adam | RMSprop
  loss: "CrossEntropy"          # CrossEntropy | MSE