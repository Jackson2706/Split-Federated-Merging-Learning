experiment:
  baseline: "hierfedavg"
  dataset: "MNIST"
  model: "MLP"
  rounds: 5
  edges: 3
  clients: 10
  tiers: 2
  scenario: "non-iid"
  noniid_type: "dirichlet"
  alpha: 0.3
  classes_per_client: 2

training:
  local_epochs: 1
  batch_size: 32
  lr: 0.01
  optimizer: "SGD"
  loss: "CrossEntropy"