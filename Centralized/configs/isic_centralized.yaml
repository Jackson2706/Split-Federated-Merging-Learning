# ISIC Centralized Configuration
dataset: isic
model: cnn
input_channels: 3
output_channels: 9
batch_size: 32
num_clients: 1  # Centralized learning
lr: 0.01
num_communication: 5
momentum: 0.9
weight_decay: 0.0
isic_image_size: 224
classes_per_client: 9  # Set to 9 to include all ISIC classes
iid: 1  # IID distribution to ensure all classes are available

