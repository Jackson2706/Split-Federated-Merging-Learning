# Camera-ready SMOKE config for H-SFP (CIFAR-100, ResNet50).
# Tiny + fast: a few clients, 2 rounds, minimal SSL/synthesis. NOT for paper numbers.
base: ../../classification/h-sfp/cifar_our_resnet50_5_10.yaml

num_users: 8
mid_server: [2]
epochs: 2
frac: 1.0
t1: 1
t2: 2
local_bs: 16
ssl_epochs_client: 1
ssl_epochs_edge: 1
syn_epochs_cloud: 1
syn_samples_per_class: 5
