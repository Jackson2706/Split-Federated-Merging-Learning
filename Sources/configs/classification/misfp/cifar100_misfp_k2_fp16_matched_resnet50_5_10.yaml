# Matched-byte comparison against MiSFP-K1 (fp32): K=2 components at float16,
# with every client->edge and edge->cloud packet capped at the byte size of the
# K=1 float32 packet for the same classes (per packet, per round).
base: cifar100_misfp_k2_resnet50_5_10.yaml
misfp_precision: "float16"
misfp_client_budget: "match_k1_fp32"
misfp_edge_budget: "match_k1_fp32"
